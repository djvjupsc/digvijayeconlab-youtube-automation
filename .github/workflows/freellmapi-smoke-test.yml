name: FreeLLMAPI integration smoke test

on:
  push:
    branches:
      - test/freellmapi-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freellmapi-smoke-test
  cancel-in-progress: false

jobs:
  freellmapi-smoke-test:
    name: Test FreeLLMAPI on an isolated GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the selected test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download and build FreeLLMAPI
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git freellmapi
          cd freellmapi
          npm ci
          npm run build

      - name: Start temporary localhost-only FreeLLMAPI server
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_AI_STUDIO_API_KEY" || { echo "Missing GOOGLE_AI_STUDIO_API_KEY repository secret."; exit 1; }
          export HOST=127.0.0.1
          export PORT=3001
          export NODE_ENV=production
          export ENCRYPTION_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export FREEAPI_DB_PATH="$RUNNER_TEMP/freellmapi.sqlite"
          export CI_ADMIN_PASSWORD="$(node -e 'console.log(require("crypto").randomBytes(24).toString("base64url"))')"
          echo "::add-mask::$CI_ADMIN_PASSWORD"
          echo "CI_ADMIN_PASSWORD=$CI_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          export FREEAPI_CONFIG_JSON="$(node -e '
            const config = {
              admin: { email: "ci-admin@localhost", password: process.env.CI_ADMIN_PASSWORD },
              keys: [{ platform: "google", key: process.env.GOOGLE_AI_STUDIO_API_KEY, label: "GitHub Actions smoke test", enabled: true }],
              models: [{ platform: "google", modelId: "gemini-3.5-flash-lite", displayName: "Gemini Flash Lite", fallbackEnabled: true }],
              routing: { strategy: "balanced" }
            };
            process.stdout.write(JSON.stringify(config));
          ' )"
          cd freellmapi
          nohup node server/dist/index.js > "$RUNNER_TEMP/freellmapi.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/freellmapi.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/api/auth/status >/dev/null; then
              echo "FreeLLMAPI server is responding on localhost."
              exit 0
            fi
            sleep 2
          done
          echo "FreeLLMAPI did not become ready. Recent server log:"
          tail -n 80 "$RUNNER_TEMP/freellmapi.log"
          exit 1

      - name: Authenticate and retrieve the temporary unified API key
        run: |
          set -euo pipefail
          LOGIN="$(curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            -d "$(node -e 'process.stdout.write(JSON.stringify({email:"ci-admin@localhost",password:process.env.CI_ADMIN_PASSWORD}))')" \
            http://127.0.0.1:3001/api/auth/login)"
          DASHBOARD_TOKEN="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).token))' <<< "$LOGIN")"
          test -n "$DASHBOARD_TOKEN"
          API_KEY_RESPONSE="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $DASHBOARD_TOKEN" \
            http://127.0.0.1:3001/api/settings/api-key)"
          UNIFIED_KEY="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).apiKey))' <<< "$API_KEY_RESPONSE")"
          test -n "$UNIFIED_KEY"
          echo "::add-mask::$UNIFIED_KEY"
          echo "FREELLMAPI_UNIFIED_KEY=$UNIFIED_KEY" >> "$GITHUB_ENV"
          echo "Temporary unified key retrieved and masked; it will not be printed."

      - name: Send one minimal OpenAI-compatible Economics prompt
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail \
            --max-time 150 \
            -H "Authorization: Bearer $FREELLMAPI_UNIFIED_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"gemini-3.5-flash-lite","messages":[{"role":"system","content":"Answer accurately and concisely. Do not invent facts."},{"role":"user","content":"In one sentence, define opportunity cost in economics."}],"temperature":0.1,"max_tokens":120}' \
            http://127.0.0.1:3001/v1/chat/completions)"
          node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const r=JSON.parse(s);
              const answer=r.choices?.[0]?.message?.content;
              if(typeof answer!=="string" || !answer.trim()) {
                process.stderr.write("Smoke test failed: no assistant text in response.\n");
                process.exit(1);
              }
              process.stdout.write("FreeLLMAPI returned a non-empty OpenAI-compatible response.\n");
              process.stdout.write("Model: "+String(r.model||"not reported")+"\n");
              process.stdout.write("Response length: "+answer.trim().length+" characters.\n");
            });
          ' <<< "$RESPONSE"

      - name: Stop temporary server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/freellmapi.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/freellmapi.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/freellmapi.sqlite" "$RUNNER_TEMP/freellmapi.sqlite-wal" "$RUNNER_TEMP/freellmapi.sqlite-shm"
