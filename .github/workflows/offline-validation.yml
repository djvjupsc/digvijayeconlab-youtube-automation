name: DigvijayEconLab offline validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "test/**"]

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Devanagari font, eSpeak and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core espeak-ng
          fc-cache -f
          fc-match -f '%{family}\\n%{file}\\n' 'Noto Sans Devanagari:lang=hi'
          python -m pip install numpy Pillow gradio_client huggingface_hub

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run offline unit and real eSpeak regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate production plan and topic queue
        run: |
          python scripts/daily_production.py validate
          python scripts/topic_queue.py validate --queue config/topic_queue.json
