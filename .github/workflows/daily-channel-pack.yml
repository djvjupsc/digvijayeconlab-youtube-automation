name: DigvijayEconLab daily ten-unit production pack

on:
  # Manual runs only until the live production reliability test is complete.
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Retry today's failed pack after inspecting its partial artifact"
        required: false
        type: boolean
        default: false
      llm_provider:
        description: "Primary AI route. FreeLLMAPI enables independent Cloudflare/Hugging Face fallbacks; requires the Google AI Studio secret."
        required: true
        type: choice
        options:
          - gemini
          - freellmapi
        default: freellmapi
      resume_from_run_id:
        description: "Optional previous failed workflow run ID; reuse only lesson packages with matching topics and a passing academic gate"
        required: false
        type: string
        default: ""
      create_public_playlists:
        description: "One-time opt-in: create the ten public YouTube playlists"
        required: false
        type: boolean
        default: false
      authorize_private_staging_uploads:
        description: "Explicit opt-in: upload audited videos to YouTube as PRIVATE for owner review"
        required: false
        type: boolean
        default: false
      allow_placeholder_voice_preview:
        description: "Use eSpeak PREVIEW narration if free Chatterbox quota is exhausted (not the owner's voice; never upload)"
        required: false
        type: boolean
        default: true

concurrency:
  group: digvijayeconlab-daily-ten-unit-pack
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  daily-production:
    name: Generate ten lesson packages, one Short and one Community post
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install open-source Short rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow gradio_client huggingface_hub

      - name: Run offline tests and validate the ten-unit plan
        run: |
          python -m compileall -q scripts tests
          python -c "from PIL import features; assert features.check_feature('raqm'), 'Pillow libraqm support is required for Hindi shaping'"
          python -m unittest discover -s tests -v
          python scripts/daily_production.py validate
          python scripts/topic_queue.py validate --queue config/topic_queue.json

      - name: Verify independent providers before claiming production pack
        id: provider_preflight
        if: inputs.llm_provider == 'freellmapi'
        env:
          LLM_PROVIDER: freellmapi
          FREELLMAPI_API_KEY: preflight-placeholder-key
          FREELLMAPI_BASE_URL: http://127.0.0.1:3999/v1
          FREELLMAPI_MODEL: gemini-3.5-flash-lite
          HF_FALLBACK_MODEL: Qwen/Qwen3-4B-Instruct-2507:cheapest
          CLOUDFLARE_FALLBACK_MODEL: "@cf/meta/llama-3.2-3b-instruct"
        run: python scripts/provider_preflight.py

      - name: Claim today's production pack
        id: prepare
        env:
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: |
          RETRY_ARGS=()
          if [ "$RETRY_FAILED" = "true" ]; then
            RETRY_ARGS+=(--retry-failed)
          fi
          python scripts/daily_production.py prepare \
            --run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT" \
            "${RETRY_ARGS[@]}"

      - name: Record the production claim in the workflow run only
        if: steps.prepare.outputs.claimed == 'true'
        run: |
          echo "Claimed run $GITHUB_RUN_ID for publication date ${{ steps.prepare.outputs.publication_date }}."
          echo "Production state is finalized from workflow outcome; no branch push is required."
      - name: Set up Node.js for temporary FreeLLMAPI
        if: steps.prepare.outputs.claimed == 'true' && inputs.llm_provider == 'freellmapi'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start temporary FreeLLMAPI for production generation
        if: steps.prepare.outputs.claimed == 'true' && inputs.llm_provider == 'freellmapi'
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          PROVIDER_KEY="${GOOGLE_AI_STUDIO_API_KEY:-$GEMINI_API_KEY}"
          test -n "$PROVIDER_KEY" || { echo "Missing GOOGLE_AI_STUDIO_API_KEY (or existing GEMINI_API_KEY fallback) repository secret."; exit 1; }
          echo "::add-mask::$PROVIDER_KEY"
          export HOST=127.0.0.1
          export PORT=3001
          export NODE_ENV=production
          export ENCRYPTION_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export FREEAPI_DB_PATH="$RUNNER_TEMP/freellmapi-production.sqlite"
          export CI_ADMIN_PASSWORD="$(node -e 'console.log(require("crypto").randomBytes(24).toString("base64url"))')"
          echo "::add-mask::$CI_ADMIN_PASSWORD"
          echo "CI_ADMIN_PASSWORD=$CI_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          export FREEAPI_CONFIG_JSON="$(PROVIDER_KEY="$PROVIDER_KEY" node -e '
            const config = {
              admin: { email: "ci-admin@example.com", password: process.env.CI_ADMIN_PASSWORD },
              keys: [{ platform: "google", key: process.env.PROVIDER_KEY, label: "DigvijayEconLab production run", enabled: true }],
              models: [{ platform: "google", modelId: "gemini-3.5-flash-lite", displayName: "Gemini Flash Lite", fallbackEnabled: true }],
              routing: { strategy: "balanced" }
            };
            process.stdout.write(JSON.stringify(config));
          ')"
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git "$RUNNER_TEMP/freellmapi"
          cd "$RUNNER_TEMP/freellmapi"
          test "$(git rev-parse HEAD)" = "fb07845faf7cf986ea9f3692e055076035dd8739" || { echo "Unexpected FreeLLMAPI source revision."; exit 1; }
          npm ci
          npm run build
          nohup node server/dist/index.js > "$RUNNER_TEMP/freellmapi-production.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/freellmapi-production.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/api/auth/status >/dev/null; then
              echo "Temporary FreeLLMAPI is ready on localhost."
              exit 0
            fi
            sleep 2
          done
          tail -n 80 "$RUNNER_TEMP/freellmapi-production.log"
          exit 1

      - name: Retrieve masked temporary FreeLLMAPI key
        if: steps.prepare.outputs.claimed == 'true' && inputs.llm_provider == 'freellmapi'
        run: |
          set -euo pipefail
          LOGIN="$(curl --silent --show-error --fail -H 'Content-Type: application/json' \
            -d "$(node -e 'process.stdout.write(JSON.stringify({email:"ci-admin@example.com",password:process.env.CI_ADMIN_PASSWORD}))')" \
            http://127.0.0.1:3001/api/auth/login)"
          TOKEN="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).token))' <<< "$LOGIN")"
          KEY_RESPONSE="$(curl --silent --show-error --fail -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3001/api/settings/api-key)"
          UNIFIED_KEY="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).apiKey))' <<< "$KEY_RESPONSE")"
          test -n "$UNIFIED_KEY"
          echo "::add-mask::$UNIFIED_KEY"
          echo "FREELLMAPI_API_KEY=$UNIFIED_KEY" >> "$GITHUB_ENV"
          echo "FREELLMAPI_BASE_URL=http://127.0.0.1:3001/v1" >> "$GITHUB_ENV"
          echo "FREELLMAPI_MODEL=gemini-3.5-flash-lite" >> "$GITHUB_ENV"
          echo "LLM_FALLBACK_PROVIDER=${{ steps.provider_preflight.outputs.fallback_chain }},gemini" >> "$GITHUB_ENV"

      - name: Create or verify ten public YouTube playlists
        if: steps.prepare.outputs.claimed == 'true' && inputs.create_public_playlists == true
        continue-on-error: true
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: |
          python scripts/youtube_playlist_setup.py

      - name: Restore a previous failed run artifact for resume
        if: steps.prepare.outputs.claimed == 'true' && inputs.resume_from_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.resume_from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: resume-artifact

      - name: Generate and review ten unit lesson packages, Short assets and Community post
        if: steps.prepare.outputs.claimed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LLM_PROVIDER: ${{ inputs.llm_provider }}
          LLM_FALLBACK_PROVIDER: ${{ steps.provider_preflight.outputs.fallback_chain }},gemini
          FREELLMAPI_BASE_URL: http://127.0.0.1:3001/v1
          FREELLMAPI_MODEL: gemini-3.5-flash-lite
          CHATTERBOX_ENABLED: ${{ vars.CHATTERBOX_ENABLED }}
          CHATTERBOX_SPACE: ${{ vars.CHATTERBOX_SPACE }}
          CHATTERBOX_REFERENCE_REPO: ${{ vars.CHATTERBOX_REFERENCE_REPO }}
          CHATTERBOX_REFERENCE_FILENAME: ${{ vars.CHATTERBOX_REFERENCE_FILENAME }}
          CHATTERBOX_PREVIEW_FALLBACK: ${{ inputs.allow_placeholder_voice_preview }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id }}
        run: |
          RESUME_ARGS=()
          if [ -n "$RESUME_FROM_RUN_ID" ]; then
            RESUME_ARGS+=(--resume-from-dir resume-artifact)
          fi
          python scripts/daily_production.py process --manifest output/daily_manifest.json "${RESUME_ARGS[@]}"

      - name: Stop temporary FreeLLMAPI after generation
        if: always() && steps.prepare.outputs.claimed == 'true' && inputs.llm_provider == 'freellmapi'
        run: |
          if [ -f "$RUNNER_TEMP/freellmapi-production.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/freellmapi-production.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/freellmapi-production.sqlite" "$RUNNER_TEMP/freellmapi-production.sqlite-wal" "$RUNNER_TEMP/freellmapi-production.sqlite-shm"

      - name: Render branded 16:9 thumbnails for all ten units
        if: steps.prepare.outputs.claimed == 'true'
        run: |
          DATE="${{ steps.prepare.outputs.publication_date }}"
          python scripts/render_thumbnails.py "output/seo/$DATE-seo-metadata.json" --output output/thumbnails

      - name: Render one featured 16:9 long-form lesson draft
        id: longform
        if: steps.prepare.outputs.claimed == 'true'
        continue-on-error: true
        env:
          CHATTERBOX_ENABLED: ${{ vars.CHATTERBOX_ENABLED }}
          CHATTERBOX_SPACE: ${{ vars.CHATTERBOX_SPACE }}
          CHATTERBOX_REFERENCE_REPO: ${{ vars.CHATTERBOX_REFERENCE_REPO }}
          CHATTERBOX_REFERENCE_FILENAME: ${{ vars.CHATTERBOX_REFERENCE_FILENAME }}
          CHATTERBOX_PREVIEW_FALLBACK: ${{ inputs.allow_placeholder_voice_preview }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/render_longform_video.py output/daily_manifest.json

      - name: Audit the generated Short before any publishing attempt
        if: steps.prepare.outputs.claimed == 'true'
        continue-on-error: true # Draft-only preview narration is intentionally not upload-eligible.
        run: |
          DATE=$(python -c "import json; print(json.load(open('output/daily_manifest.json'))['publication_date'])")
          python scripts/prepublish_audit.py \
            "output/shorts/$DATE-short.json" \
            "output/shorts/$DATE-short-render.json" \
            "output/shorts/$DATE-digvijayeconlab-short.mp4" \
            "output/shorts/$DATE-prepublish-audit.json"

      - name: Verify complete draft deliverables and publication eligibility
        if: always() && steps.prepare.outputs.claimed == 'true'
        run: |
          python scripts/production_completeness.py output/daily_manifest.json

      - name: Upload audited Short to YouTube as PRIVATE for human review
        if: steps.prepare.outputs.claimed == 'true' && inputs.authorize_private_staging_uploads == true
        env:
          YOUTUBE_PRIVATE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_PRIVATE_UPLOAD_ENABLED }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: |
          python scripts/youtube_private_upload.py "${{ steps.prepare.outputs.publication_date }}"

      - name: Upload featured long-form lesson to YouTube as PRIVATE
        if: steps.prepare.outputs.claimed == 'true' && inputs.authorize_private_staging_uploads == true
        continue-on-error: true
        env:
          YOUTUBE_PRIVATE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_PRIVATE_UPLOAD_ENABLED }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: |
          python scripts/youtube_private_upload.py "${{ steps.prepare.outputs.publication_date }}" --kind longform

      - name: Upload complete daily production package
        if: always() && steps.prepare.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digvijayeconlab-daily-production-${{ steps.prepare.outputs.publication_date }}
          path: |
            output/daily_manifest.json
            output/scripts/*.md
            output/reviews/*.md
            output/corrected_scripts/*.md
            output/corrections/*.md
            output/quality_checks/*.md
            output/shorts/*
            output/community/*
            output/seo/*
            output/thumbnails/*
            output/longform/*
            output/production-completeness.json
            output/youtube/*
            output/youtube-playlists.json
          if-no-files-found: warn
          retention-days: 14

      - name: Finalize daily report and persist rotation state to main
        if: always() && steps.prepare.outputs.claimed == 'true'
        env:
          PACK_JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/daily_production.py finish \
            --run-id "$GITHUB_RUN_ID" \
            --job-status "$PACK_JOB_STATUS"
          # Persist rotation/idempotency state for the next run. Only this JSON file is committed.
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/daily_production_state.json
          if git diff --cached --quiet; then
            echo "No production state change to persist."
            exit 0
          fi
          git commit -m "chore: persist daily production state [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "Daily production state persisted to main."
